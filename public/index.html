<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>⚡ SPAM TOOL</title>
<script src="/socket.io/socket.io.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',Tahoma,sans-serif}
body{background:#0a0a0a;color:#fff;min-height:100vh;padding:15px;direction:rtl}
.container{max-width:620px;margin:0 auto}
h1{color:#0f0;text-align:center;margin-bottom:5px;text-shadow:0 0 20px #0f0;font-size:26px}
.sub{text-align:center;color:#888;font-size:12px;margin-bottom:20px}
.tabs{display:flex;gap:8px;margin-bottom:15px}
.tab{flex:1;padding:14px;background:#111;border:2px solid #333;border-radius:12px;cursor:pointer;text-align:center;font-weight:bold;color:#fff;font-size:15px;transition:all .3s}
.tab.active{background:#0f0;color:#000;border-color:#0f0;box-shadow:0 0 20px rgba(0,255,0,.3)}
.tab.tg.active{background:#08c;color:#fff;border-color:#08c;box-shadow:0 0 20px rgba(0,136,204,.3)}
.card{background:#111;border:1px solid #333;border-radius:12px;padding:20px;margin-bottom:15px}
.card h3{margin-bottom:14px;font-size:16px}
.status{display:flex;align-items:center;gap:10px;font-size:14px;margin-bottom:14px;padding:10px;background:#0a0a0a;border-radius:8px}
.dot{width:12px;height:12px;border-radius:50%;background:#f00;flex-shrink:0}
.dot.on{background:#0f0;animation:pulse 2s infinite;box-shadow:0 0 10px #0f0}
@keyframes pulse{50%{opacity:.4}}
input,textarea{width:100%;padding:13px;margin:6px 0;background:#000;border:1px solid #333;border-radius:10px;color:#fff;font-size:15px;font-family:inherit;direction:ltr;text-align:left;transition:border .2s}
input:focus,textarea:focus{outline:none;border-color:#0f0}
input::placeholder,textarea::placeholder{direction:rtl;text-align:right;color:#555}
textarea{min-height:75px;resize:vertical}
button.act{width:100%;padding:15px;background:#0f0;color:#000;border:none;border-radius:10px;font-size:16px;font-weight:bold;cursor:pointer;margin-top:10px;transition:all .2s}
button.act:hover{transform:translateY(-2px);box-shadow:0 5px 20px rgba(0,255,0,.3)}
button.act:disabled{opacity:.5;cursor:not-allowed;transform:none}
button.blue{background:#08c;color:#fff}
button.blue:hover{box-shadow:0 5px 20px rgba(0,136,204,.3)}
.code-box{background:#000;border:2px dashed #0f0;padding:18px;border-radius:12px;text-align:center;margin:12px 0;display:none}
.code-box.show{display:block;animation:fadeIn .3s}
.code-box .label{color:#888;font-size:12px;margin-bottom:8px}
.code-box .code{font-size:32px;color:#ff0;font-weight:bold;letter-spacing:5px;font-family:monospace;direction:ltr;text-shadow:0 0 15px #ff0}
@keyframes fadeIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
.progress{height:12px;background:#21262d;border-radius:6px;overflow:hidden;margin-top:12px;display:none}
.progress.show{display:block}
.fill{height:100%;width:0%;background:linear-gradient(90deg,#0f0,#ff0);transition:width .3s;border-radius:6px}
.info{color:#888;font-size:12px;margin-top:10px;text-align:center;line-height:1.6}
.msg-box{background:#000;border:1px solid #333;border-radius:10px;padding:12px;margin:10px 0;font-size:14px;display:none;text-align:center;line-height:1.5}
.msg-box.show{display:block;animation:fadeIn .3s}
.msg-box.ok{border-color:#0f0;color:#0f0;background:rgba(0,255,0,.05)}
.msg-box.err{border-color:#f00;color:#f00;background:rgba(255,0,0,.05)}
.msg-box.warn{border-color:#ff0;color:#ff0;background:rgba(255,255,0,.05)}
.groups{max-height:220px;overflow-y:auto;background:#000;border-radius:10px;padding:10px;margin-top:10px;display:none;border:1px solid #333}
.groups.show{display:block}
.groups div{padding:10px;border-bottom:1px solid #222;cursor:pointer;font-size:13px;transition:.2s}
.groups div:hover{background:#1a1a1a;color:#0f0;padding-right:15px}
.groups div:last-child{border-bottom:none}
.hint{background:rgba(255,255,0,.08);border:1px solid rgba(255,255,0,.3);border-radius:8px;padding:10px;font-size:12px;color:#ff0;margin-top:10px;line-height:1.5}
.hint a{color:#0ff;text-decoration:none}
</style>
</head>
<body>
<div class="container">
    <h1>⚡ SPAM TOOL</h1>
    <p class="sub">WhatsApp + Telegram Web Panel</p>

    <div class="tabs">
        <div class="tab active" onclick="switchTab('wa')">📱 WhatsApp</div>
        <div class="tab tg" onclick="switchTab('tg')">✈️ Telegram</div>
    </div>

    <!-- ═══ WhatsApp ═══ -->
    <div id="waPanel">
        <div class="card">
            <h3 style="color:#0f0">🔗 ربط الواتساب</h3>
            <div class="status"><span class="dot" id="waDot"></span><span id="waStatus">غير متصل</span></div>
            <input type="text" id="waPhone" placeholder="📱 رقمك (201012345678)">
            <button class="act" onclick="waConnect()">🔑 طلب كود الربط</button>
            <div class="code-box" id="waCodeBox">
                <div class="label">🔑 كود الربط:</div>
                <div class="code" id="waCode">----</div>
                <div class="info">واتساب → الأجهزة المرتبطة → ربط برقم الهاتف</div>
            </div>
            <div class="msg-box" id="waCodeMsg"></div>
        </div>

        <div class="card">
            <h3 style="color:#0f0">🚀 سبام واتساب</h3>
            <input type="text" id="waTarget" placeholder="📱 رقم الهدف أو اختر جروب من تحت">
            <textarea id="waMsg" placeholder="💬 الرسالة">Hello!</textarea>
            <input type="number" id="waCount" value="10" placeholder="🔢 العدد">
            <button class="act" id="waSendBtn" onclick="waSend()">⚡ إرسال</button>
            <div class="progress" id="waProg"><div class="fill" id="waFill"></div></div>
            <div class="info" id="waProgText"></div>
        </div>

        <div class="card">
            <h3 style="color:#0f0">📋 الجروبات</h3>
            <button class="act" onclick="waGroups()">🔄 جلب الجروبات</button>
            <div class="groups" id="waGroupsList"></div>
        </div>
    </div>

    <!-- ═══ Telegram ═══ -->
    <div id="tgPanel" style="display:none">
        <div class="card">
            <h3 style="color:#08c">🔗 ربط التليجرام</h3>
            <div class="status"><span class="dot" id="tgDot"></span><span id="tgStatus">غير متصل</span></div>
            
            <div class="hint">
                💡 API ID و Hash مضبوطين بالفعل من عند صاحب الأداة
            </div>

            <input type="text" id="tgPhone" placeholder="📱 رقمك بمفتاح الدولة (201012345678)">
            <button class="act blue" id="tgConnectBtn" onclick="tgConnect()">📩 إرسال كود التحقق</button>
            
            <input type="text" id="tgCode" placeholder="📩 أدخل كود التحقق هنا" style="display:none;direction:ltr">
            <button class="act blue" id="tgVerifyBtn" onclick="tgVerify()" style="display:none">✅ تأكيد الكود</button>
            
            <input type="text" id="tgPassword" placeholder="🔐 كلمة سر 2FA (لو موجودة)" style="display:none">
            <button class="act blue" id="tgPassBtn" onclick="tgPasswordSubmit()" style="display:none">✅ تأكيد كلمة السر</button>
            
            <div class="msg-box" id="tgCodeMsg"></div>
        </div>

        <div class="card">
            <h3 style="color:#08c">🚀 سبام تليجرام</h3>
            <input type="text" id="tgTarget" placeholder="👤 @username أو ID أو اختر جروب من تحت">
            <textarea id="tgMsg" placeholder="💬 الرسالة">Hello!</textarea>
            <input type="number" id="tgCount" value="10" placeholder="🔢 العدد">
            <button class="act blue" id="tgSendBtn" onclick="tgSend()">⚡ إرسال</button>
            <div class="progress" id="tgProg"><div class="fill" id="tgFill"></div></div>
            <div class="info" id="tgProgText"></div>
        </div>

        <div class="card">
            <h3 style="color:#08c">📋 الجروبات</h3>
            <button class="act blue" onclick="tgGroups()">🔄 جلب الجروبات</button>
            <div class="groups" id="tgGroupsList"></div>
        </div>
    </div>
</div>

<script>
const socket = io({ timeout: 120000 });

// ═══ WhatsApp ═══
socket.on('wa-status', (st) => {
    const d = document.getElementById('waDot'), t = document.getElementById('waStatus');
    if (st === 'connected') { d.classList.add('on'); t.textContent = '✅ متصل'; }
    else { d.classList.remove('on'); t.textContent = '❌ غير متصل'; }
});

socket.on('wa-code', (c) => {
    document.getElementById('waCodeBox').classList.add('show');
    document.getElementById('waCode').textContent = c;
});

socket.on('wa-code-status', (msg) => {
    const b = document.getElementById('waCodeMsg');
    b.textContent = msg;
    b.className = 'msg-box show ' + (msg.includes('❌') ? 'err' : 'ok');
});

socket.on('wa-progress', (d) => {
    const pct = Math.round(d.sent / d.total * 100);
    document.getElementById('waFill').style.width = pct + '%';
    document.getElementById('waProgText').textContent = pct + '% (' + d.sent + '/' + d.total + ')';
});

socket.on('wa-done', (d) => {
    document.getElementById('waSendBtn').disabled = false;
    setTimeout(() => document.getElementById('waProg').classList.remove('show'), 2000);
    alert('✅ Sent: ' + d.sent + ' | Failed: ' + d.failed);
});

socket.on('wa-groups-list', (gs) => {
    const el = document.getElementById('waGroupsList');
    el.classList.add('show');
    el.innerHTML = gs.length ? gs.map(g => `<div onclick="document.getElementById('waTarget').value='${g.id}'">📌 ${g.name}</div>`).join('') : '<div style="color:#888;text-align:center">لا توجد جروبات</div>';
});

// ═══ Telegram ═══
socket.on('tg-status', (st) => {
    const d = document.getElementById('tgDot'), t = document.getElementById('tgStatus');
    if (st === 'connected') { d.classList.add('on'); t.textContent = '✅ متصل'; }
    else { d.classList.remove('on'); t.textContent = '❌ غير متصل'; }
});

socket.on('tg-code-status', (msg) => {
    const b = document.getElementById('tgCodeMsg');
    b.textContent = msg;
    b.className = 'msg-box show ' + (msg.includes('❌') ? 'err' : msg.includes('📩') ? 'warn' : 'ok');
});

socket.on('tg-need-code', () => {
    document.getElementById('tgCode').style.display = 'block';
    document.getElementById('tgVerifyBtn').style.display = 'block';
});

socket.on('tg-need-password', () => {
    document.getElementById('tgPassword').style.display = 'block';
    document.getElementById('tgPassBtn').style.display = 'block';
});

socket.on('tg-progress', (d) => {
    const pct = Math.round(d.sent / d.total * 100);
    document.getElementById('tgFill').style.width = pct + '%';
    document.getElementById('tgProgText').textContent = pct + '% (' + d.sent + '/' + d.total + ')';
});

socket.on('tg-done', (d) => {
    document.getElementById('tgSendBtn').disabled = false;
    setTimeout(() => document.getElementById('tgProg').classList.remove('show'), 2000);
    alert('✅ Sent: ' + d.sent + ' | Failed: ' + d.failed);
});

socket.on('tg-groups-list', (gs) => {
    const el = document.getElementById('tgGroupsList');
    el.classList.add('show');
    el.innerHTML = gs.length ? gs.map(g => `<div onclick="document.getElementById('tgTarget').value='${g.id}'">📌 ${g.name}</div>`).join('') : '<div style="color:#888;text-align:center">لا توجد جروبات</div>';
});

socket.on('error', (m) => alert('❌ ' + m));

// ═══ Actions ═══
function switchTab(t) {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    if (t === 'wa') {
        document.querySelectorAll('.tab')[0].classList.add('active');
        document.getElementById('waPanel').style.display = 'block';
        document.getElementById('tgPanel').style.display = 'none';
    } else {
        document.querySelectorAll('.tab')[1].classList.add('active');
        document.getElementById('waPanel').style.display = 'none';
        document.getElementById('tgPanel').style.display = 'block';
    }
}

function waConnect() {
    const p = document.getElementById('waPhone').value.trim();
    if (!p) return alert('اكتب رقمك');
    socket.emit('wa-connect', p);
}

function waSend() {
    const n = document.getElementById('waTarget').value.trim();
    const m = document.getElementById('waMsg').value;
    const c = parseInt(document.getElementById('waCount').value);
    if (!n || !m || !c) return alert('املأ البيانات');
    document.getElementById('waSendBtn').disabled = true;
    document.getElementById('waProg').classList.add('show');
    socket.emit('wa-spam', { number: n, message: m, count: c });
}

function waGroups() { socket.emit('wa-groups'); }

function tgConnect() {
    const p = document.getElementById('tgPhone').value.trim();
    if (!p) return alert('اكتب رقمك');
    socket.emit('tg-connect', { phone: p });
}

function tgVerify() {
    const p = document.getElementById('tgPhone').value.trim();
    const c = document.getElementById('tgCode').value.trim();
    if (!c) return alert('اكتب الكود');
    socket.emit('tg-verify', { phone: p, code: c });
}

function tgPasswordSubmit() {
    const p = document.getElementById('tgPhone').value.trim();
    const pass = document.getElementById('tgPassword').value.trim();
    if (!pass) return alert('اكتب كلمة السر');
    socket.emit('tg-verify-pass', { phone: p, password: pass });
}

function tgSend() {
    const t = document.getElementById('tgTarget').value.trim();
    const m = document.getElementById('tgMsg').value;
    const c = parseInt(document.getElementById('tgCount').value);
    if (!t || !m || !c) return alert('املأ البيانات');
    document.getElementById('tgSendBtn').disabled = true;
    document.getElementById('tgProg').classList.add('show');
    socket.emit('tg-spam', { target: t, message: m, count: c });
}

function tgGroups() { socket.emit('tg-groups'); }
</script>
</body>
</html>
