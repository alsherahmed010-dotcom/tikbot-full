<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikBot Dashboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            padding: 12px;
            font-size: 15px;
        }
        .header { text-align: center; margin: 10px 0 15px 0; }
        .header h1 { color: #58a6ff; font-size: 1.4rem; }
        .card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .card h2 { font-size: 1.05rem; color: #f0f6fc; margin-bottom: 10px; }
        .add-box { display: flex; flex-direction: column; gap: 10px; }
        input {
            width: 100%;
            padding: 12px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #fff;
            font-size: 1rem;
            outline: none;
        }
        input:focus { border-color: #58a6ff; }
        button {
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-add { background: #238636; color: white; }
        .acc-item {
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .acc-info { display: flex; justify-content: space-between; align-items: center; }
        .acc-name { font-weight: bold; color: #58a6ff; font-size: 1rem; }
        .acc-coins { background: #1f6feb; color: white; padding: 3px 8px; border-radius: 12px; font-size: 0.85rem; }
        .acc-status { font-size: 0.85rem; }
        .status-run { color: #3fb950; font-weight: bold; }
        .status-stopped { color: #f85149; font-weight: bold; }
        .acc-actions { display: flex; gap: 8px; margin-top: 5px; }
        .acc-actions button { flex: 1; padding: 8px; font-size: 0.85rem; }
        .btn-stop { background: #d29922; color: #000; }
        .btn-start { background: #238636; color: #fff; }
        .btn-del { background: #da3633; color: white; }
        .empty { text-align: center; color: #8b949e; padding: 15px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🚀 TikBot Dashboard</h1>
    </div>

    <div class="card">
        <h2>إضافة حساب جديد</h2>
        <form class="add-box" onsubmit="addAccount(event)">
            <input type="text" id="username" placeholder="اكتب اسم المستخدم (Username)..." required autocomplete="off">
            <button type="submit" class="btn-add">إضافة وبدء التجميع ➕</button>
        </form>
    </div>

    <div class="card">
        <h2>الحسابات المضافة</h2>
        <div id="acc-list"><div class="empty">جاري تحميل البيانات...</div></div>
    </div>

    <script>
        async function loadAccounts() {
            try {
                const res = await fetch('/api/accounts');
                const data = await res.json();
                const list = document.getElementById('acc-list');
                
                if (!data || data.length === 0) {
                    list.innerHTML = '<div class="empty">لا توجد حسابات مضافة حالياً</div>';
                    return;
                }

                list.innerHTML = data.map(acc => `
                    <div class="acc-item">
                        <div class="acc-info">
                            <span class="acc-name">@${acc.username}</span>
                            <span class="acc-coins">${acc.coins || 0} نقطة</span>
                        </div>
                        <div class="acc-status">
                            الحالة: ${acc.status === 'running' 
                                ? '<span class="status-run">شغال ويجمع 🟢</span>' 
                                : '<span class="status-stopped">متوقف 🔴</span>'}
                        </div>
                        <div class="acc-actions">
                            ${acc.status === 'running' 
                                ? `<button class="btn-stop" onclick="toggleStatus('${acc.id}', 'stop')">إيقاف ⏸️</button>`
                                : `<button class="btn-start" onclick="toggleStatus('${acc.id}', 'start')">تشغيل ▶️</button>`}
                            <button class="btn-del" onclick="deleteAccount('${acc.id}')">حذف 🗑️</button>
                        </div>
                    </div>
                `).join('');
            } catch (e) {
                console.error(e);
            }
        }

        async function addAccount(e) {
            e.preventDefault();
            const input = document.getElementById('username');
            const username = input.value.trim();
            if (!username) return;

            const res = await fetch('/api/accounts', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username })
            });

            if (res.ok) {
                input.value = '';
                loadAccounts();
            } else {
                alert('حدث خطأ أو الحساب مضاف مسبقاً');
            }
        }

        async function toggleStatus(id, action) {
            await fetch(`/api/accounts/${id}/${action}`, { method: 'POST' });
            loadAccounts();
        }

        async function deleteAccount(id) {
            if (confirm('هل تريد حذف هذا الحساب؟')) {
                await fetch(`/api/accounts/${id}`, { method: 'DELETE' });
                loadAccounts();
            }
        }

        setInterval(loadAccounts, 3000);
        loadAccounts();
    </script>
</body>
</html>
