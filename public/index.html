<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikBot Dashboard</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            font-size: 20px;
            line-height: 1.8;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            width: 98%;
        }
        h1 {
            color: #38bdf8;
            font-size: 2.5rem;
            text-align: center;
            margin-bottom: 30px;
        }
        .card {
            background: #1e293b;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            border: 1px solid #334155;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            font-size: 1.2rem;
        }
        th, td {
            padding: 16px 20px;
            text-align: right;
            border-bottom: 1px solid #334155;
        }
        th {
            background-color: #0f172a;
            color: #38bdf8;
            font-size: 1.3rem;
        }
        .badge {
            background-color: #22c55e;
            color: #fff;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 1.1rem;
            font-weight: bold;
        }
        input, button {
            font-size: 1.2rem;
            padding: 14px 20px;
            border-radius: 8px;
            border: none;
            margin: 5px;
        }
        button {
            background-color: #0284c7;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background-color: #0369a1; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 لوحة تحكم TikBot</h1>
        <div class="card">
            <h2>إحصائيات الحسابات والعملات</h2>
            <table>
                <thead>
                    <tr>
                        <th>اسم الحساب</th>
                        <th>العملات الحالية</th>
                        <th>الحالة</th>
                    </tr>
                </thead>
                <tbody id="accounts-list">
                    <tr>
                        <td colspan="3" style="text-align: center;">جاري تحميل البيانات...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    <script>
        async function loadData() {
            try {
                const res = await fetch('/api/accounts');
                const data = await res.json();
                const tbody = document.getElementById('accounts-list');
                if (data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="3" style="text-align: center;">لا توجد حسابات نشطة حالياً</td></tr>';
                    return;
                }
                tbody.innerHTML = data.map(acc => `
                    <tr>
                        <td><b>@${acc.username || acc.id}</b></td>
                        <td><span class="badge">${acc.coins || 0} عملة</span></td>
                        <td><span style="color: #4ade80;">شغال 🟢</span></td>
                    </tr>
                `).join('');
            } catch (e) {
                console.error(e);
            }
        }
        setInterval(loadData, 5000);
        loadData();
    </script>
</body>
</html>
