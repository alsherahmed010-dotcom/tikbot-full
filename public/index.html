<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<title>⚡ PURPLE HACK v8.0</title>
<script src="/socket.io/socket.io.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,'Segoe UI',sans-serif}
body{background:#0a0512;color:#e0d0ff;min-height:100vh;padding:12px;direction:rtl}
.wrap{max-width:560px;margin:0 auto}
h1{text-align:center;font-size:22px;padding:14px 0 6px;color:#b847ff}
.sub{text-align:center;font-size:11px;color:#7a6b99;margin-bottom:14px}
input,textarea,button{font-family:inherit;font-size:14px}
input,textarea{width:100%;padding:12px;background:#15092a;border:1px solid #2a1b4e;border-radius:10px;color:#e0d0ff;margin-bottom:8px;outline:none;direction:ltr;text-align:left}
input:focus,textarea:focus{border-color:#b847ff}
input::placeholder,textarea::placeholder{direction:rtl;text-align:right;color:#5a4a7a}
textarea{min-height:60px;resize:vertical}
.b{width:100%;padding:14px;background:#b847ff;color:#fff;border:none;border-radius:10px;font-weight:700;cursor:pointer;margin-bottom:8px;transition:.15s}
.b:hover{background:#c95fff}
.b:active{transform:scale(.98)}
.b.blue{background:#0088ff}.b.blue:hover{background:#1a99ff}
.b.gray{background:#2a1b4e;color:#a090c0}.b.gray:hover{background:#3a2b5e}
.b.red{background:#c92040}.b.red:hover{background:#e03050}
.row{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}
.row button{margin:0;padding:10px;font-size:12px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px}
.tab{padding:12px;background:#15092a;border:1px solid #2a1b4e;border-radius:10px;text-align:center;cursor:pointer;font-weight:700;color:#7a6b99;font-size:13px;transition:.15s}
.tab.active{background:#b847ff;color:#fff;border-color:#b847ff}
.tab.tg.active{background:#0088ff;border-color:#0088ff}
.card{background:#15092a;border:1px solid #2a1b4e;border-radius:12px;padding:14px;margin-bottom:10px}
.card h3{font-size:14px;margin-bottom:12px;color:#b847ff;display:flex;justify-content:space-between;align-items:center}
.card h3 .st{font-size:11px;font-weight:normal;padding:3px 8px;border-radius:100px;background:#2a1b4e;color:#7a6b99}
.card h3 .st.on{background:#1a5c2e;color:#00ff95}
.card h3 .st.warn{background:#5c4a1a;color:#ffbb33}
.msg{padding:10px;border-radius:8px;font-size:12px;margin:8px 0;text-align:center;display:none}
.msg.show{display:block}
.msg.ok{background:rgba(0,255,149,.1);color:#00ff95}
.msg.err{background:rgba(255,46,92,.1);color:#ff5c85}
.msg.warn{background:rgba(255,187,51,.1);color:#ffbb33}
.code{background:#0a0512;border:1px dashed #b847ff;padding:16px;border-radius:10px;text-align:center;margin:8px 0;display:none}
.code.show{display:block}
.code .val{font-size:26px;font-weight:900;color:#b847ff;letter-spacing:3px;direction:ltr;font-family:monospace}
.code .lbl{font-size:10px;color:#7a6b99;margin-bottom:6px;letter-spacing:2px}
.groups{max-height:280px;overflow-y:auto;margin-top:8px;display:none}
.groups.show{display:block}
.gi{display:flex;justify-content:space-between;align-items:center;padding:10px;background:#0a0512;border-radius:8px;margin-bottom:4px;cursor:pointer;font-size:12px}
.gi:hover{background:#1a0d3a}
.gi .cn{font-size:10px;background:#2a1b4e;color:#b847ff;padding:2px 8px;border-radius:100px;margin-left:6px}
.media-lbl{display:block;padding:14px;background:#0a0512;border:2px dashed #2a1b4e;border-radius:10px;text-align:center;cursor:pointer;margin-bottom:8px;transition:.15s}
.media-lbl:hover{border-color:#b847ff;background:#1a0d3a}
.media-lbl .ic{font-size:22px}
.media-lbl .tx{font-size:11px;color:#7a6b99;margin-top:4px}
.mi{display:flex;justify-content:space-between;align-items:center;padding:8px;background:#0a0512;border-radius:8px;margin-bottom:4px;font-size:11px;gap:6px}
.mi .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mi input[type=number]{width:44px;margin:0;padding:4px;font-size:11px;text-align:center}
.mi button{background:#c92040;color:#fff;border:none;padding:4px 8px;border-radius:6px;cursor:pointer;font-size:11px;margin:0;width:auto}
.jobs{margin-top:10px}
.ji{background:#0a0512;border:1px solid #2a1b4e;border-radius:10px;padding:12px;margin-bottom:6px}
.ji .hdr{display:flex;justify-content:space-between;font-size:11px;margin-bottom:6px;color:#7a6b99}
.ji .hdr .t{color:#b847ff;font-weight:700}
.ji .tgt{font-size:12px;color:#fff;font-family:monospace;direction:ltr;text-align:right;margin-bottom:6px;word-break:break-all}
.ji .pg{height:4px;background:#15092a;border-radius:2px;overflow:hidden}
.ji .pf{height:100%;background:#b847ff;transition:width .2s}
.ji .stats{display:flex;justify-content:space-between;font-size:11px;color:#7a6b99;margin-bottom:6px}
.ji .stats b{color:#b847ff}
.ji.done .pf{background:#00ff95}
.modal{position:fixed;inset:0;background:rgba(10,5,18,.95);z-index:1000;display:none;padding:10px}
.modal.show{display:flex;align-items:center;justify-content:center}
.chat{width:100%;max-width:520px;height:85vh;background:#15092a;border:1px solid #2a1b4e;border-radius:14px;display:flex;flex-direction:column;overflow:hidden}
.chat-hd{padding:12px;background:#0a0512;border-bottom:1px solid #2a1b4e;display:flex;justify-content:space-between;align-items:center}
.chat-hd .ti{color:#fff;font-size:13px;font-weight:700;flex:1;overflow:hidden}
.chat-hd .cn{color:#7a6b99;font-size:10px;margin-top:2px}
.chat-hd .x{background:#c92040;color:#fff;border:none;width:32px;height:32px;border-radius:8px;cursor:pointer;font-weight:700}
.chat-bd{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:6px}
.m{max-width:80%;padding:8px 12px;border-radius:12px;font-size:12px;line-height:1.4;word-wrap:break-word}
.m.them{background:#2a1b4e;align-self:flex-start;border-bottom-left-radius:3px}
.m.me{background:#b847ff;color:#fff;align-self:flex-end;border-bottom-right-radius:3px}
.m .sn{font-size:10px;font-weight:700;opacity:.7;margin-bottom:2px}
.m .tm{font-size:9px;opacity:.6;margin-top:3px;text-align:left;direction:ltr}
.chat-ft{padding:8px;background:#0a0512;border-top:1px solid #2a1b4e;display:flex;gap:6px}
.chat-ft input{flex:1;margin:0;padding:10px;font-size:12px}
.chat-ft input[type=number]{width:50px;flex:0 0 50px;text-align:center}
.chat-ft button{background:#b847ff;color:#fff;border:none;padding:10px 14px;border-radius:8px;cursor:pointer;font-weight:700;margin:0;width:auto}
.empty{text-align:center;color:#5a4a7a;padding:20px;font-size:12px}
</style>
</head>
<body>
<div class="wrap">
  <h1>⚡ PURPLE HACK</h1>
  <div class="sub">v8.0 · أقصى سرعة</div>

  <input type="text" id="sessionInput" placeholder="🆔 Session ID...">
  <button class="b" onclick="registerSession()">🔌 اتصال</button>

  <div class="row">
    <button class="b gray" onclick="waReconnect()">🔄 إعادة الاتصال</button>
    <button class="b red" onclick="wipeSessions()">🗑️ مسح الكل</button>
  </div>

  <div class="msg" id="sessionStatus"></div>

  <div class="tabs">
    <div class="tab active" onclick="switchTab('wa')">📱 واتساب</div>
    <div class="tab tg" onclick="switchTab('tg')">✈️ تليجرام</div>
  </div>

  <!-- WhatsApp -->
  <div id="waPanel">
    <div class="card">
      <h3>ربط الواتساب <span class="st" id="waSt">غير متصل</span></h3>
      <div id="waConn">
        <input type="text" id="waPhone" placeholder="📱 رقمك (201012345678)">
        <button class="b" onclick="waConnect()">🔑 طلب كود الربط</button>
        <button class="b gray" onclick="waLogout()">🚪 تسجيل الخروج</button>
        <div class="code" id="waCodeBox"><div class="lbl">🔑 كود الربط</div><div class="val" id="waCode">----</div></div>
        <div class="msg" id="waCodeMsg"></div>
      </div>
    </div>

    <div class="card">
      <h3>🚀 إرسال نصوص (أقصى سرعة)</h3>
      <input type="text" id="waTarget" placeholder="📱 رقم أو @g.us">
      <textarea id="waMsg" placeholder="💬 الرسالة">Hello!</textarea>
      <input type="number" id="waCount" value="10" placeholder="🔢 العدد">
      <button class="b" onclick="waSend()">⚡ انطلق (30 متوازي للرقم)</button>
    </div>

    <div class="card">
      <h3>🎬 صور وفيديوهات</h3>
      <label for="waMediaFile" class="media-lbl">
        <div class="ic">📎</div>
        <div class="tx" id="waMName">اختر ملفات (متعدد)</div>
      </label>
      <input type="file" id="waMediaFile" accept="image/*,video/*" multiple style="display:none" onchange="pickMedia('wa',this)">
      <div id="waMList" style="display:none;max-height:180px;overflow-y:auto"></div>
      <div class="row">
        <input type="number" id="waMRep" value="1" min="1" placeholder="× لكل ملف" style="margin:0">
        <input type="text" id="waMCap" placeholder="تعليق" style="margin:0">
      </div>
      <button class="b" onclick="sendMedia('wa')" style="margin-top:8px">🎬 إرسال (<span id="waMTot">0</span>)</button>
    </div>

    <div class="card">
      <h3>👥 الجروبات</h3>
      <button class="b gray" onclick="waGroups()">🔄 جلب الجروبات</button>
      <div class="groups" id="waGroupsList"></div>
    </div>
  </div>

  <!-- Telegram -->
  <div id="tgPanel" style="display:none">
    <div class="card">
      <h3>ربط التليجرام <span class="st" id="tgSt">غير متصل</span></h3>
      <div id="tgConn">
        <input type="text" id="tgPhone" placeholder="📱 رقمك">
        <button class="b blue" onclick="tgConnect()">📩 إرسال كود</button>
        <button class="b gray" onclick="tgLogout()">🚪 تسجيل الخروج</button>
        <input type="text" id="tgCode" placeholder="📩 كود التحقق" style="display:none">
        <button class="b blue" id="tgVB" onclick="tgVerify()" style="display:none">✅ تأكيد</button>
        <input type="text" id="tgPass" placeholder="🔐 2FA" style="display:none">
        <button class="b blue" id="tgPB" onclick="tgPassSubmit()" style="display:none">✅ تأكيد</button>
        <div class="msg" id="tgMsg"></div>
      </div>
    </div>

    <div class="card">
      <h3>🚀 إرسال نصوص</h3>
      <input type="text" id="tgTarget" placeholder="👤 @username">
      <textarea id="tgMsgIn" placeholder="💬 الرسالة">Hello!</textarea>
      <input type="number" id="tgCount" value="10" placeholder="🔢 العدد">
      <button class="b blue" onclick="tgSend()">⚡ انطلق (5 متوازي)</button>
    </div>

    <div class="card">
      <h3>🎬 صور وفيديوهات</h3>
      <label for="tgMediaFile" class="media-lbl">
        <div class="ic">📎</div>
        <div class="tx" id="tgMName">اختر ملفات (متعدد)</div>
      </label>
      <input type="file" id="tgMediaFile" accept="image/*,video/*" multiple style="display:none" onchange="pickMedia('tg',this)">
      <div id="tgMList" style="display:none;max-height:180px;overflow-y:auto"></div>
      <div class="row">
        <input type="number" id="tgMRep" value="1" min="1" placeholder="× لكل ملف" style="margin:0">
        <input type="text" id="tgMCap" placeholder="تعليق" style="margin:0">
      </div>
      <button class="b blue" onclick="sendMedia('tg')" style="margin-top:8px">🎬 إرسال (<span id="tgMTot">0</span>)</button>
    </div>

    <div class="card">
      <h3>👥 الجروبات</h3>
      <button class="b gray" onclick="tgGroups()">🔄 جلب</button>
      <div class="groups" id="tgGroupsList"></div>
    </div>
  </div>

  <!-- Jobs -->
  <div class="card">
    <h3>📊 العمليات <button class="b gray" style="width:auto;padding:4px 10px;font-size:11px;margin:0" onclick="clearJobs()">مسح</button></h3>
    <div class="jobs" id="jobsList"><div class="empty">لا توجد عمليات</div></div>
  </div>
</div>

<div class="modal" id="waModal">
  <div class="chat">
    <div class="chat-hd">
      <div><div class="ti" id="waChatTitle">جروب</div><div class="cn" id="waChatCount">—</div></div>
      <button class="x" onclick="closeChat()">✕</button>
    </div>
    <div class="chat-bd" id="waChatMsgs"><div class="empty">⏳ جاري التحميل...</div></div>
    <div class="chat-ft">
      <input type="text" id="waChatInput" placeholder="اكتب..." onkeypress="if(event.key==='Enter')sendChat()">
      <input type="number" id="waChatCount2" value="1" min="1">
      <button onclick="sendChat()">📤</button>
    </div>
  </div>
</div>

<script>
const socket = io({timeout:600000,reconnection:true,reconnectionDelay:3000,reconnectionAttempts:Infinity,transports:['websocket','polling']});
let currentSession='', currentChatGid=null;
const mediaFiles = { wa:[], tg:[] };

function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmtSize(b){if(b<1024)return b+'B';if(b<1048576)return (b/1024).toFixed(1)+'KB';return (b/1048576).toFixed(2)+'MB';}
function showMsg(id,txt,type){const e=document.getElementById(id);e.textContent=txt;e.className='msg show '+type;}

function registerSession(){
  const s=document.getElementById('sessionInput').value.trim();
  if(!s)return alert('اكتب Session ID');
  currentSession=s;localStorage.setItem('session_id',s);
  socket.emit('register-session',s);
  showMsg('sessionStatus','✅ متصل بـ '+s,'ok');
}
window.addEventListener('load',()=>{const s=localStorage.getItem('session_id');if(s){document.getElementById('sessionInput').value=s;registerSession();}});
socket.on('connect',()=>{if(currentSession)socket.emit('register-session',currentSession);});

function setWASt(st,txt){
  const e=document.getElementById('waSt');e.textContent=txt;e.className='st';
  if(st==='connected')e.classList.add('on');
  else if(st==='pending')e.classList.add('warn');
}
function setTGSt(st,txt){
  const e=document.getElementById('tgSt');e.textContent=txt;e.className='st';
  if(st==='connected')e.classList.add('on');
  else if(st==='pending')e.classList.add('warn');
}

socket.on('wa-status',(s)=>{
  if(s==='connected')setWASt('connected','✅ متصل');
  else if(s==='connecting')setWASt('pending','🔄 يتصل...');
  else if(s==='reconnecting')setWASt('pending','🔄 إعادة...');
  else if(s==='session_exists')setWASt('pending','🔑 جلسة موجودة');
  else if(s==='logged_out')setWASt('off','🚪 خروج');
  else setWASt('off','❌ غير متصل');
});
socket.on('wa-code',(c)=>{document.getElementById('waCodeBox').classList.add('show');document.getElementById('waCode').textContent=c;});
socket.on('wa-code-status',(m)=>{showMsg('waCodeMsg',m,m.includes('❌')?'err':'ok');});

// MEDIA
async function pickMedia(platform, inp){
  const fs=Array.from(inp.files||[]); inp.value='';
  for(const f of fs){
    if(f.size>20*1048576){alert('❌ '+f.name+' > 20MB');continue;}
    try{
      const buf=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(new Uint8Array(r.result));r.onerror=rej;r.readAsArrayBuffer(f);});
      mediaFiles[platform].push({name:f.name,size:f.size,mimetype:f.type||'application/octet-stream',buffer:buf,count:1});
    }catch(e){alert('فشل قراءة '+f.name);}
  }
  renderMedia(platform);
}
function renderMedia(platform){
  const fs=mediaFiles[platform];
  const list=document.getElementById(platform+'MList');
  const nameEl=document.getElementById(platform+'MName');
  const totalEl=document.getElementById(platform+'MTot');
  if(!fs.length){list.style.display='none';nameEl.textContent='اختر ملفات (متعدد)';totalEl.textContent='0';return;}
  nameEl.textContent='✅ '+fs.length+' ملف';
  list.style.display='block';
  let tot=0;
  list.innerHTML=fs.map((f,i)=>{
    const t=f.count||1;tot+=t;
    return `<div class="mi"><div class="nm">${f.mimetype.startsWith('video/')?'🎬':'🖼️'} ${esc(f.name)} (${fmtSize(f.size)})</div><input type="number" value="${t}" min="1" onchange="updCount('${platform}',${i},this.value)"><button onclick="delMedia('${platform}',${i})">✕</button></div>`;
  }).join('');
  totalEl.textContent=tot;
}
function updCount(p,i,v){mediaFiles[p][i].count=Math.max(1,parseInt(v)||1);renderMedia(p);}
function delMedia(p,i){mediaFiles[p].splice(i,1);renderMedia(p);}
function sendMedia(platform){
  if(!currentSession)return alert('اكتب Session ID');
  const fs=mediaFiles[platform];
  if(!fs.length)return alert('اختر ملفات');
  const target=document.getElementById(platform==='wa'?'waTarget':'tgTarget').value.trim();
  if(!target)return alert('اكتب الهدف');
  const cap=document.getElementById(platform+'MCap').value;
  const rep=Math.max(1,parseInt(document.getElementById(platform+'MRep').value)||1);
  const payload=fs.map(f=>({name:f.name,size:f.size,mimetype:f.mimetype,buffer:f.buffer,count:f.count||rep}));
  if(platform==='wa')socket.emit('wa-spam-media',{number:target,files:payload,caption:cap,repeatEach:rep});
  else socket.emit('tg-spam-media',{target,files:payload,caption:cap,repeatEach:rep});
  alert('⏳ بدأ الإرسال');
}

// GROUPS
socket.on('wa-groups-list',(gs)=>{
  const el=document.getElementById('waGroupsList');el.classList.add('show');
  if(!gs.length){el.innerHTML='<div class="empty">لا توجد جروبات</div>';return;}
  el.innerHTML=gs.map(g=>`<div class="gi" data-gid="${g.id}" onclick="openChat('${g.id}','${g.name.replace(/'/g,"\\'")}')"><span>📌 ${esc(g.name)}</span><span><span class="cn">${g.count||0}</span>💬</span></div>`).join('');
});
function openChat(gid,name){currentChatGid=gid;document.getElementById('waChatTitle').textContent=name;document.getElementById('waChatCount').textContent='...';document.getElementById('waChatMsgs').innerHTML='<div class="empty">⏳ تحميل...</div>';document.getElementById('waModal').classList.add('show');socket.emit('wa-group-messages',gid);}
function closeChat(){document.getElementById('waModal').classList.remove('show');currentChatGid=null;}
socket.on('wa-group-messages-list',(d)=>{
  if(d.groupId!==currentChatGid)return;
  document.getElementById('waChatCount').textContent='📨 '+d.count+' رسالة';
  const el=document.getElementById('waChatMsgs');
  if(!d.messages||!d.messages.length){el.innerHTML='<div class="empty">لا توجد رسائل</div>';return;}
  el.innerHTML=d.messages.map(m=>{
    const c=m.fromMe?'me':'them',t=m.time?new Date(m.time*1000).toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'}):'';
    const s=m.fromMe?'أنت':(m.pushName||m.from||'?');
    return `<div class="m ${c}"><div class="sn">${esc(s)}</div><div>${esc(m.text)}</div><div class="tm">${t}</div></div>`;
  }).join('');
  el.scrollTop=el.scrollHeight;
});
socket.on('wa-new-message',(d)=>{
  if(d.groupId!==currentChatGid)return;
  const el=document.getElementById('waChatMsgs');const m=d.message;
  const ld=el.querySelector('.empty');if(ld)ld.remove();
  const c=m.fromMe?'me':'them',t=m.time?new Date(m.time*1000).toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'}):'';
  const s=m.fromMe?'أنت':(m.pushName||m.from||'?');
  el.innerHTML+=`<div class="m ${c}"><div class="sn">${esc(s)}</div><div>${esc(m.text)}</div><div class="tm">${t}</div></div>`;
  el.scrollTop=el.scrollHeight;
});
function sendChat(){const i=document.getElementById('waChatInput');const t=i.value.trim();if(!t||!currentChatGid)return;const c=Math.max(1,parseInt(document.getElementById('waChatCount2').value)||1);socket.emit('wa-group-send',{groupId:currentChatGid,text:t,count:c});i.value='';}
socket.on('wa-group-send-ok',(d)=>{
  if(d.groupId!==currentChatGid)return;
  const el=document.getElementById('waChatMsgs');const t=new Date(d.time*1000).toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'});
  el.innerHTML+=`<div class="m me"><div class="sn">أنت</div><div>${esc(d.text)}</div><div class="tm">${t}</div></div>`;
  el.scrollTop=el.scrollHeight;
});
socket.on('wa-cache-update',(gs)=>{
  const el=document.getElementById('waGroupsList');
  if(!el.classList.contains('show'))return;
  el.querySelectorAll('.gi').forEach(it=>{const g=gs.find(x=>x.id===it.dataset.gid);if(g){const c=it.querySelector('.cn');if(c)c.textContent=g.count;}});
});

// TG
socket.on('tg-status',(s)=>{
  if(s==='connected')setTGSt('connected','✅ متصل');
  else if(s==='connecting')setTGSt('pending','🔄...');
  else setTGSt('off','❌ غير متصل');
});
socket.on('tg-code-status',(m)=>showMsg('tgMsg',m,m.includes('❌')?'err':'ok'));
socket.on('tg-need-code',()=>{document.getElementById('tgCode').style.display='block';document.getElementById('tgVB').style.display='block';});
socket.on('tg-need-password',()=>{document.getElementById('tgPass').style.display='block';document.getElementById('tgPB').style.display='block';});
socket.on('tg-groups-list',(gs)=>{
  const el=document.getElementById('tgGroupsList');el.classList.add('show');
  if(!gs.length){el.innerHTML='<div class="empty">لا توجد</div>';return;}
  el.innerHTML=gs.map(g=>`<div class="gi" onclick="document.getElementById('tgTarget').value='${g.id}'"><span>📌 ${esc(g.name)}</span><span>↗</span></div>`).join('');
});
socket.on('logout-done',(t)=>alert('✅ تم الخروج من '+t));

// JOBS
socket.on('jobs-update',(jobs)=>{
  const list=document.getElementById('jobsList');
  const mine=jobs.filter(j=>j.sessionId===currentSession);
  if(!mine.length){list.innerHTML='<div class="empty">لا توجد عمليات</div>';return;}
  list.innerHTML=mine.map(j=>{
    const pct=Math.round(j.sent/j.count*100);
    const st={running:'جاري',done:'انتهى',stopped:'متوقف',error:'خطأ'}[j.status]||j.status;
    const sb=j.status==='running'?`<button class="b red" style="width:auto;padding:3px 8px;font-size:10px;margin:0;float:left" onclick="stopJob('${j.id}')">⏹</button>`:'';
    return `<div class="ji ${j.status}"><div class="hdr"><span class="t">${j.type}</span><span>${st} ${sb}</span></div><div class="tgt">${j.target}</div><div class="stats"><span>✉️ <b>${j.sent}</b>/${j.count}</span><span>❌ ${j.failed}</span><span>${pct}%</span></div><div class="pg"><div class="pf" style="width:${pct}%"></div></div></div>`;
  }).join('');
});
socket.on('error',(m)=>alert('❌ '+m));

function switchTab(t){
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  if(t==='wa'){document.querySelectorAll('.tab')[0].classList.add('active');document.getElementById('waPanel').style.display='block';document.getElementById('tgPanel').style.display='none';}
  else{document.querySelectorAll('.tab')[1].classList.add('active');document.getElementById('waPanel').style.display='none';document.getElementById('tgPanel').style.display='block';}
}
function waConnect(){if(!currentSession)return alert('اكتب Session ID');const p=document.getElementById('waPhone').value.trim();if(!p)return alert('اكتب رقمك');socket.emit('wa-connect',p);}
function waLogout(){if(confirm('خروج؟'))socket.emit('wa-logout');}
function waReconnect(){if(!currentSession)return alert('اكتب Session ID');socket.emit('wa-reconnect');}
function waSend(){if(!currentSession)return alert('اكتب Session ID');const n=document.getElementById('waTarget').value.trim();const m=document.getElementById('waMsg').value;const c=parseInt(document.getElementById('waCount').value);if(!n||!m||!c)return alert('املأ البيانات');socket.emit('wa-spam',{number:n,message:m,count:c});}
function waGroups(){socket.emit('wa-groups');}
function tgConnect(){if(!currentSession)return alert('اكتب Session ID');const p=document.getElementById('tgPhone').value.trim();if(!p)return alert('اكتب رقمك');socket.emit('tg-connect',{phone:p});}
function tgVerify(){const p=document.getElementById('tgPhone').value.trim();const c=document.getElementById('tgCode').value.trim();if(!c)return alert('اكتب الكود');socket.emit('tg-verify',{phone:p,code:c});}
function tgPassSubmit(){const p=document.getElementById('tgPhone').value.trim();const pw=document.getElementById('tgPass').value.trim();if(!pw)return alert('اكتب كلمة السر');socket.emit('tg-verify-pass',{phone:p,password:pw});}
function tgLogout(){if(confirm('خروج؟'))socket.emit('tg-logout');}
function tgSend(){if(!currentSession)return alert('اكتب Session ID');const t=document.getElementById('tgTarget').value.trim();const m=document.getElementById('tgMsgIn').value;const c=parseInt(document.getElementById('tgCount').value);if(!t||!m||!c)return alert('املأ البيانات');socket.emit('tg-spam',{target:t,message:m,count:c});}
function tgGroups(){socket.emit('tg-groups');}
function stopJob(j){if(j.startsWith('wa_'))socket.emit('wa-stop',j);else socket.emit('tg-stop',j);}
function clearJobs(){if(confirm('مسح؟'))socket.emit('clear-jobs');}
async function wipeSessions(){
  if(!confirm('⚠️ مسح كل الجلسات؟'))return;
  if(!confirm('تأكيد؟'))return;
  try{const r=await fetch('/api/wipe-sessions',{method:'POST'});const j=await r.json();if(j.success){alert('✅ تم');location.reload();}else alert('❌ '+j.error);}catch(e){alert('❌ '+e.message);}
}
</script>
