<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TikBot Control</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Cairo', sans-serif; background: #0a0e17; min-height: 100vh; color: #fff; padding: 15px; }
        .app { max-width: 550px; margin: 0 auto; }
        .card { background: #151c2c; border: 1px solid #232d42; border-radius: 20px; padding: 22px 18px; margin-bottom: 14px; }
        .title { font-size: 20px; font-weight: 900; text-align: center; color: #22c55e; margin-bottom: 4px; }
        .total-box { text-align: center; background: rgba(34,197,94,.1); border: 1px solid rgba(34,197,94,.3); border-radius: 16px; padding: 18px; margin-bottom: 14px; }
        .total-box .num { font-size: 42px; font-weight: 900; color: #22c55e; }
        .total-box .lbl { color: #94a3b8; font-size: 13px; }
        .input { width: 100%; padding: 13px 15px; margin: 7px 0; background: #0a0e17; border: 1px solid #232d42; border-radius: 12px; color: #fff; font-family: inherit; font-size: 14px; outline: none; }
        .btn { width: 100%; padding: 12px; margin: 6px 0; border: none; border-radius: 12px; font-family: inherit; font-size: 14px; font-weight: 900; cursor: pointer; }
        .btn-green { background: #22c55e; color: #000; }
        .btn-blue { background: #2563eb; color: #fff; }
        .btn-red { background: rgba(239,68,68,.15); color: #ef4444; border: 1px solid rgba(239,68,68,.3); }
        .acc-card { background: #0a0e17; border: 1px solid #232d42; border-radius: 14px; padding: 14px; margin: 8px 0; display: flex; align-items: center; justify-content: space-between; }
        .acc-info { flex: 1; }
        .acc-name { font-weight: 900; font-size: 15px; }
        .acc-coins { color: #22c55e; font-size: 12px; }
        .acc-actions { display: flex; gap: 6px; }
        .btn-sm { padding: 8px 12px; border-radius: 8px; border: none; font-size: 11px; font-weight: 700; cursor: pointer; }
        .section { font-size: 16px; font-weight: 900; color: #22c55e; margin: 15px 0 8px; }
    </style>
</head>
<body>
<div class="app">
    <div class="card">
        <div class="total-box">
            <div class="num" id="totalCoins">0</div>
            <div class="lbl">💰 إجمالي العملات</div>
        </div>
    </div>
    <div class="card">
        <div class="title">➕ إضافة حساب</div>
        <input class="input" id="username" placeholder="TikTok username">
        <button class="btn btn-green" onclick="addAccount()">إضافة</button>
    </div>
    <div class="card">
        <div class="section">📱 الحسابات</div>
        <div id="accounts"></div>
    </div>
</div>
<script>
const API = window.location.origin;
async function loadAccounts() {
    const r = await fetch(API + '/api/accounts');
    const data = await r.json();
    const list = document.getElementById('accounts');
    if (data.accounts.length === 0) {
        list.innerHTML = '<p style="color:#94a3b8;text-align:center">لا توجد حسابات</p>';
    } else {
        list.innerHTML = data.accounts.map(acc => `
            <div class="acc-card">
                <div class="acc-info">
                    <div class="acc-name">@${acc.username}</div>
                    <div class="acc-coins">💰 ${acc.coins} عملة</div>
                </div>
                <div class="acc-actions">
                    <button class="btn-sm btn-blue" onclick="runBot(${acc.id})">▶️</button>
                    <button class="btn-sm btn-red" onclick="delAccount(${acc.id})">🗑️</button>
                </div>
            </div>
        `).join('');
    }
    const tr = await fetch(API + '/api/total-coins');
    const td = await tr.json();
    document.getElementById('totalCoins').textContent = td.total;
}
async function addAccount() {
    const username = document.getElementById('username').value.trim().replace('@', '');
    if (!username) return;
    await fetch(API + '/api/accounts', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username})});
    document.getElementById('username').value = '';
    loadAccounts();
}
async function delAccount(id) {
    if (!confirm('حذف؟')) return;
    await fetch(API + '/api/accounts/' + id, {method:'DELETE'});
    loadAccounts();
}
async function runBot(id) {
    alert('🚀 جاري التشغيل...');
    await fetch(API + '/api/run-bot/' + id, {method:'POST'});
}
loadAccounts();
setInterval(loadAccounts, 5000);
</script>
</body>
</html>
